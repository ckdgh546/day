function latestGameLog(type){return [...(S.logs||[])].reverse().find(l=>l.type===type);}
function manualGameActive(){const start=latestGameLog('game-start'),stop=latestGameLog('game-stop');return !!(start&&start.at>(stop?.at||0)&&Date.now()/1000-start.at<8*3600);}
function gameSessionMinutes(){const start=latestGameLog('game-start');return manualGameActive()?Math.max(0,Math.floor((Date.now()/1000-start.at)/60)):0;}

const focused=()=>document.activeElement&&['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
function remainingTask(t){return Math.max(0,Number(t.minutes||0)-Number(t.worked||0));}
function dueNote(t){if(!t.due)return '마감 미설정';const d=new Date(t.due);const diff=d-Date.now();return diff<0?'마감 지남':diff<3600000?`마감 ${Math.max(0,Math.ceil(diff/60000))}분 전`:d.toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function todaySpend(){const month=dateString(new Date()).slice(0,7);return (S.expenses||[]).filter(e=>dateString(new Date(e.at*1000)).startsWith(month)).reduce((x,e)=>x+e.amount,0)}
function messageText(){
 const recent=[...(S.messages||[])].reverse().find(m=>m.role==='companion');
 if(recent&&recent.at&&Date.now()/1000-recent.at<3600)return recent.text;
 const name=char().name,forecast=taskForecast(),buy=monthlySpendGuide();
 if((gameIsActive()||manualGameActive())&&pending().length)return `게임은 저장하고 올 수 있지? ${pending()[0].title}부터 딱 2분만 같이 해보자. 🎮`;
 if(forecast.overloaded)return `마감 전에 끝내려면 시간이 좀 부족해 보여. ${name}가 지금 할 일 하나부터 같이 골라줄게. 📝`;
 if(buy.budget&&buy.remaining<0)return `지출이 설정한 한도를 넘었어. 자책하지 말고 오늘 추가 구매부터 한 번 멈춰보자. 🛍️`;
 return recent?.text||'오늘도 완벽한 계획보다, 지금 할 수 있는 하나부터 해보자 💛';
}

function gameIsActive(){return S.easy?.observe&&S.activity?.current==='game';}
const hasDay=()=>S.easy?.startedAt>0&&Date.now()/1000-S.easy.startedAt<22*3600&&!(S.easy.nightAt>=S.easy.startedAt);
function latestLog(type){return [...S.logs].reverse().find(l=>l.type===type);}
function needsReturn(){return gameIsActive()||manualGameActive();}
function currentStep(){
 if(S.timer){return {tag:S.timer.awaiting?'실제 진행 확인':S.timer.paused?'잠깐 멈춤':'집중 중',title:S.timer.label||'진행 중인 작업',description:S.timer.awaiting?'타이머가 끝났어. 실제로 한 만큼만 기록하자.':S.timer.paused?'준비되면 이어가면 돼.':'다른 일을 벌이지 말고 지금 한 가지에 집중하자.',btn:S.timer.awaiting?'실제로 한 시간 기록':'타이머 보기',action:'timerDialog'};}
 if(!hasDay()&&!pending().length)return {tag:'ONE STEP',title:'오늘을 시작할까?',description:'일어나서 버튼 한 번. 운동과 첫 작업 알림은 내가 알아서 준비할게.',btn:'일어났어 · 오늘 시작',action:'day.start'};
 let task=pending()[0];
 if(needsReturn()&&task)return {tag:'게임에서 복귀',title:'게임은 잠깐 저장하고, 작업으로 2분만 돌아오자',description:`우선순위: ${task.title} · 지금 딱 2분만 시작해도 돼.`,btn:'2분 복귀 시작',action:'return'};
 if(task)return {tag:task.due?'마감 작업 먼저':'첫 작업 시작',title:task.firstStep||task.title,description:`${task.title} · 남은 예상 ${remainingTask(task)}분 ${task.due?'· '+dueNote(task):''}`,btn:'10분만 작업 시작',action:'focus',id:task.id};
 return {tag:'하루를 이어가기',title:'작업부터 작게 시작하자',description:'아직 추가한 작업이 없어도 괜찮아. 프로젝트 열기부터 시작해도 돼.',btn:'10분 시작',action:'focus'};
}
async function req(path,body){
 if(path==='state')return DW.state;
 if(path==='status')return {...DW.status,native:guardLink.connected};
 if(path==='action')return DW.dispatch(body.type,body.payload||{});
 if(path==='games/suggest'){if(guardLink.connected)return guardRequest('processes');throw Error('Windows 게임 감지 보조 프로그램이 실행되지 않았어.');}
 throw Error('이 기능은 독립 웹앱에서 제공되지 않아.');
}

function toast(s,error=false){const old=Q('#toast');if(old)old.remove();const el=document.createElement('div');el.id='toast';el.className='toast'+(error?' error':'');el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),4300)}
async function act(type,payload={}){if(busy)return null;busy=true;try{S=await req('action',{type,payload});render();return S;}catch(e){toast(e.message,true);return null;}finally{busy=false}}
function actionButton(text,action,cls='outline',attrs=''){return `<button class="button ${cls}" data-act="${action}" ${attrs}>${text}</button>`;}
function photoHTML(){const c=char();return `<div class="face">${c.photo?`<img src="${E(c.photo)}" alt="사용자가 선택한 캐릭터 사진">`:`<img src="${window.DAYWITH_PORTRAIT}" alt="기본 캐릭터 이미지">`}<button class="edit-face" data-act="photo">📷 사진 변경</button><div class="face-name"><strong>${E(c.name)}</strong><div>${E(toneLine[c.tone]||toneLine.bright)}</div></div></div>`;}
function cloudStatusBar(){const st=DW.status.cloud;const text=st.connected?(st.pending?`☁ 업로드 대기 ${st.pending}개`:'☁ 기기 간 동기화 켜짐'):'☁ 기기별 저장 · 동기화 꺼짐';

 <p class="cloud-small" style="margin-top:16px">☑ PC와 휴대폰에서 같은 계정을 사용하면 자동 공유. ☑ 로그인이 없으면 이 기기에만 저장. ☑ 기존 4.0 파일은 백업 JSON을 가져올 수 있어.</p><div class="cloud-help">${actionButton('4.0 백업 가져오기','cloudImportV4','outline')}${actionButton('현재 기록 백업','backup','outline')}${actionButton('닫기','close','ghost')}</div></div></div>`;
 dialog('내 기록 동기화',content);
}
function shell(){return `<div class="shell"><header class="top"><div class="logo"><span>♡</span>DayWith <small class="muted">6.1</small></div><nav class="nav">${navs.map(([p,i,t])=>`<button data-page="${p}" class="${p===page?'active':''}">${t}</button>`).join('')}</nav><div class="top-note">내 페이스로 다시 시작하기</div></header><section class="page-header"><div><div class="eyebrow">${dateString(new Date())} · ONE DAY AT A TIME</div><h1>${page==='today'?'오늘도 같이 해보자 🌿':navs.find(x=>x[0]===page)?.[2]||'DayWith'}</h1><p>${page==='today'?'해야 할 일을 잊지 않게, 시작할 때와 멈출 때만 알려줄게.':page==='tasks'?'마감이 급한 일부터 보여주고, 실제로 한 만큼 남겨둘게.':page==='games'?'게임에 빠졌다가도 다시 작업으로 돌아올 수 있도록.':page==='money'?'충동적인 결제는 미루고, 실제 쓴 돈은 분명하게.':page==='life'?'운동·수면·복용을 한 화면에서 간단히 확인해.':page==='chat'?'내 사진·말투로 나를 도와주는 캐릭터와 이야기해.':'캐릭터 한 명만, 자주 쓰는 설정만.'}</p></div>${page==='today'?actionButton('☁ 동기화 설정','cloudDialog','outline mini'):''}</section><div id="cloudStatus"></div><div id="contents"></div><footer class="footer">DayWith 6.1 · 단일 HTML · PC·휴대폰 독립 실행 · 로그인하면 클라우드에 동기화 · 게임 감지는 Windows 전용</footer></div><nav class="bottom-nav">${[['today','☀','오늘'],['tasks','✓','할 일'],['games','🎮','게임'],['money','₩','돈'],['life','🌙','생활'],['chat','💬','대화'],['settings','⚙','설정']].map(([p,i,t])=>`<button data-page="${p}" class="${p===page?'active':''}"><span>${i}</span>${t}</button>`).join('')}</nav>`;}

function forecastCard(compact=false){const f=taskForecast();if(!f.rows.length)return '';
 const tight=f.maxShortfall>0;const urgent=f.rows.filter(r=>r.risk==='overdue'||r.risk==='tight');
 return `<section class="card forecast-card"><div class="card-title"><h2>📅 마감 역산</h2><span>${f.rows.length}개 작업</span></div>
 <p class="small">하루 업무 가능 시간을 <b>${Math.round(f.capacity/60*10)/10}시간</b>으로 가정한 대략적인 계획이야. 실제 촬영·약속은 반영하지 못해.</p>
 ${tight?`<div class="notice warn" style="margin-top:12px"><b>현재 예상량이 마감 전 가용 시간보다 최대 ${Math.ceil(f.maxShortfall/60*10)/10}시간 많아.</b><br>바로 첫 작업을 시작하면서 범위 축소·마감 협의도 검토해.</div>`:`<div class="notice" style="margin-top:12px">마감 순서로 시작하면 돼. 무리해서 수면 시간을 줄이지 말자.</div>`}
 <div class="toolbar" style="margin-top:13px">${actionButton('지금 10분 시작','focus','primary mini',`data-id="${E(f.first?.task.id||'')}"`)}${actionButton('작업 가능 시간','capacityDialog','outline mini')}${compact?actionButton('전체 계획','page','ghost mini','data-next="tasks"'):''}</div></section>`;}

function todayQueueCard(){const jobs=pending(),limit=capacity();if(!jobs.length)return '';
 let left=limit,rows=[];for(const t of jobs){if(left<=0)break;const take=Math.min(remainingTask(t),left);if(take>0){rows.push({task:t,take});left-=take;}}
 const total=rows.reduce((n,x)=>n+x.take,0);
 return `<section class="card today-queue"><div class="card-title"><h2>🎬 오늘 추천 작업 순서</h2><span>하루 ${Math.round(limit/60*10)/10}시간 가정</span></div>
 <p class="small">촬영·편집을 구분하지 않고 마감 순서대로 자동으로 나눴어. 실제 시간이 부족하면 ‘작업 가능 시간’을 줄여줘.</p>
 ${rows.slice(0,5).map((v,i)=>`<div class="row-task"><div><strong>${i+1}. ${E(v.task.title)}</strong><small>오늘 추천 ${v.take}분 · ${E(dueNote(v.task))}</small></div>${actionButton('시작','focus','outline mini',`data-id="${E(v.task.id)}"`)}</div>`).join('')}
 <div class="toolbar">${actionButton('작업 가능 시간','capacityDialog','outline mini')}${actionButton('마감 목록','page','ghost mini','data-next="tasks"')}</div></section>`;
}

 return `<section class="card quick-stop"><div class="card-title"><h2>잠깐, 지금 멈추고 싶은 충동</h2><span>한 번 눌러서 전환</span></div>
 <div class="choice quick-choices"><button data-act="${game?'returnFromGame':'gameStart'}"><strong>${game?'🎮 게임 끝내고 복귀':'🎮 게임 시작 기록'}</strong><small>${game?`현재 ${gameSessionMinutes()}분째 · 작업 2분 복귀`:'게임을 켜기 전에 10분 후 알림 예약'}</small></button>

 <button data-act="page" data-next="life"><strong>🌿 몸·수면 챙기기</strong><small>운동 시작, PC 마감, 복약 확인</small></button></div>
 ${risk?'<p class="small" style="margin-top:9px">마감이 빠듯한 일이 있어. 2분 복귀가 도움이 될 수 있어.</p>':''}</section>`;}
function home(){const c=char(),next=currentStep(),ps=pending(),spent=todaySpend(),budget=S.settings.monthlyBudget||0;const active=gameIsActive()||manualGameActive();const f=taskForecast();const guide=monthlySpendGuide();const dueSoon=ps.filter(t=>t.due&&new Date(t.due).getTime()-Date.now()<24*3600000);const focusToday=S.logs.filter(l=>['focus','return'].includes(l.type)&&dateString(new Date(l.at*1000))===dateString(new Date())).reduce((v,l)=>v+l.value,0);

function parseMoneyEntry(input){
 let text=String(input||'').trim();const mo=text.match(/(\d{1,3}(?:\.\d+)?)\s*만\s*(\d{1,3})\s*천\s*원?/);
 let amount=0, matched='';if(mo){amount=Math.round(Number(mo[1])*10000+Number(mo[2])*1000);matched=mo[0]}
 else{const x=text.match(/(\d{1,3}(?:\.\d+)?)\s*만\s*원?|([\d,]+)\s*천\s*원?|([\d,]+)\s*원|([\d,]{4,})/);
  if(x){matched=x[0];amount=x[1]?Math.round(Number(x[1])*10000):x[2]?Math.round(Number(x[2].replace(/,/g,''))*1000):Number((x[3]||x[4]||'').replace(/,/g,''));}}
 const install=text.match(/(\d{1,3})\s*개월/);const months=install?Number(install[1]):1;
 const title=text.replace(matched,' ').replace(install?.[0]||'',' ').replace(/^(지출|구매|사고싶어|사고 싶어|결제)\s*/,'').replace(/\s+/g,' ').trim();
 return {title:title||'기타',amount,installments:months};
}

alue="${E(s.cutoff)}"></div><div class="field"><label>게임 보호 종료</label><input name="routineEnd" type="time" value="${E(s.routineEnd||s.wakeTarget)}"></div><div class="field"><label>운동 시작 알림 · 기상 후</label><select name="movementDelay">${[15,30,45,60,90,120].map(v=>`<option value="${v}" ${s.movementDelay===v?'selected':''}>${v}분</option>`).join('')}</select></div><div class="field"><label>작업 시작 알림 · 기상 후</label><select name="workDelay">${[30,60,90,120,180].map(v=>`<option value="${v}" ${s.workDelay===v?'selected':''}>${v}분</option>`).join('')}</select></div></div><div class="switchline"><div><strong>매일 PC 마감 알림 켜기</strong><p>앱을 켜 놓았을 때 30분·10분 전·마감 정시 안내</p></div><input type="checkbox" name="routineEnabled" ${s.routineEnabled?'checked':''}></div><p class="small" style="margin-top:12px">웹앱이 열려 있을 때 알림을 표시해. PC 게임 감지·백그라운드 복귀 알림은 Windows 보조 프로그램이 담당해.</p><div class="toolbar"><button class="button primary" type="submit">설정 저장</button></div></form></section></div><section class="card"><div class="card-title"><h2>휴대폰·다른 PC에서도</h2><span>PC 전원과 무관</span></div><p class="small">GitHub Pages에 배포하면 인터넷만 있으면 어디서든 같은 주소로 사용 가능해. PC가 꺼져 있어도 문제없어. 같은 계정이면 기록까지 자동으로 연동돼.</p><div class="toolbar">${actionButton('홈 화면에 설치 · 연결 안내','phone','primary')}</div></section><section class="card"><div class="card-title"><h2>기록과 백업</h2><span>기본값은 로컬</span></div><div class="toolbar">${actionButton('기록 JSON 다운로드','backup','outline')}${actionButton('Windows 감지 연결','guardDialog','outline')}</div><p class="small" style="margin-top:11px">금액·수면·약 복용 기록과 사진이 들어 있으니 백업 파일은 안전한 장소에 보관해.</p></section></div>`;}

function parseQuickTask(text){let s=text.trim(),due='',minutes=60;const now=new Date();
 const when=(v)=>{const d=new Date(now);d.setDate(d.getDate()+v);d.setHours(23,59,0,0);return dtString(d)};
 if(/모레(까지)?/.test(s)){due=when(2);s=s.replace(/모레(까지)?/g,'')}else if(/내일(까지|까지는)?/.test(s)){due=when(1);s=s.replace(/내일(까지|까지는)?/g,'')}else if(/오늘(까지|까지는)?/.test(s)){due=when(0);s=s.replace(/오늘(까지|까지는)?/g,'')}
 const dur=s.match(/(\d{1,2})\s*시간(?:\s*(\d{1,2})\s*분)?/);if(dur){minutes=Number(dur[1])*60+Number(dur[2]||0);s=s.replace(dur[0],'')}
 const mins=s.match(/(\d{1,3})\s*분/);if(!dur&&mins){minutes=Number(mins[1]);s=s.replace(mins[0],'')}
 return {title:s.replace(/^[\s,·]+|[\s,·]+$/g,'').trim()||text.trim(),minutes:Math.max(1,Math.min(1440,minutes)),due,firstStep:''};
}

function calendarExport(){const jobs=pending().filter(t=>t.due&&!Number.isNaN(new Date(t.due).getTime()));if(!jobs.length){toast('마감이 입력된 작업이 없어. 먼저 마감 시간을 등록해줘.');return;}
 const icsEscape=x=>String(x||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');
 const utc=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');const stampNow=utc(new Date());
 const rows=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//DayWith//Deadline reminders//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
 for(const t of jobs){const d=new Date(t.due);const start=new Date(d.getTime()-30*60000);rows.push('BEGIN:VEVENT','UID:'+t.id+'@daywith','DTSTAMP:'+stampNow,'DTSTART:'+utc(start),'DTEND:'+utc(d),'SUMMARY:'+icsEscape('DayWith 마감: '+t.title),'DESCRIPTION:'+icsEscape('예상 남은 '+remainingTask(t)+'분 · 일정 변경 시 다시 내보내기 필요'),'BEGIN:VALARM','TRIGGER:-PT15M','ACTION:DISPLAY','DESCRIPTION:DayWith 마감 확인','END:VALARM','END:VEVENT');}
 rows.push('END:VCALENDAR');const blob=new Blob([rows.join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='DayWith_마감_알림.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('캘린더 파일 저장. 휴대폰 캘린더에 가져오면 알림을 설정할 수 있어. 자동 갱신은 아니야.');}

async function phoneDialog(){dialog('휴대폰에서 사용하기',`<p>PC가 꺼져 있어도 되는 독립 웹앱이야. 동일한 HTML 파일을 PC·휴대폰에서 각각 열어 쓸 수 있어. 기기 간 동기화는 HTML을 GitHub Pages에 올리고 클라우드 설정 후 같은 계정으로 로그인해야 해.</p><div class="cloud-inline"><b>안드로이드(크롬)</b> · 브라우저 메뉴 → 홈 화면에 추가 / 앱 설치<br><b>아이폰(사파리)</b> · 공유 버튼 → 홈 화면에 추가</div><p class="small" style="margin-top:12px">로그인이 없으면 기록은 그 기기에만 저장돼. 휴대폰에서 안정적으로 사용하려면 한 주소로 호스팅하는 걸 권장해.</p><div class="toolbar">${actionButton('☁ 클라우드 로그인','cloudDialog','primary')}${actionButton('닫기','close','outline')}</div>`);}

function voiceDialog(){dialog('캐릭터 목소리 선택',`${voiceSettings()}<p class="small" style="margin-top:14px">${baseVoice}</p>`);populateVoices()}
function getVoices(){return typeof speechSynthesis!=='undefined'?speechSynthesis.getVoices():[]}
function populateVoices(){const sels=QA('#voiceSelect');if(!sels.length)return;const voices=getVoices();const korean=voices.filter(v=>v.lang.toLowerCase().startsWith('ko')),available=korean.length?korean:voices;for(const sel of sels){let choice='<option value="">'+(available.length?'기본 설정':'기기에서 사용 가능한 음성을 찾지 못함')+'</option>';choice+=available.map(v=>`<option value="${E(v.name)}" ${voiceCfg.name===v.name?'selected':''}>${E(v.name)} · ${E(v.lang)}</option>`).join('');sel.innerHTML=choice;if(voiceCfg.name&&available.some(v=>v.name===voiceCfg.name))sel.value=voiceCfg.name;}}
function speak(text,manual=false){if(typeof speechSynthesis==='undefined'){if(manual)toast('이 브라우저는 음성 재생을 지원하지 않아.',true);return}if(!voiceCfg.enabled&&!manual)return;const all=getVoices();const pick=all.find(v=>v.name===voiceCfg.name)||(all.find(v=>v.lang.toLowerCase().startsWith('ko')&&!v.name.toLowerCase().includes('male'))||all.find(v=>v.lang.toLowerCase().startsWith('ko')));if(!pick){if(manual)toast('이 기기에서 사용할 수 있는 한국어 음성이 없어.',true);return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.voice=pick;u.rate=voiceCfg.rate;u.pitch=voiceCfg.pitch;speechSynthesis.speak(u)}
function loadVoice(){try{Object.assign(voiceCfg,JSON.parse(localStorage.getItem('daywith.voice4')||'{}'))}catch{}}
function saveVoice(){localStorage.setItem('daywith.voice4',JSON.stringify(voiceCfg))}

 setInterval(async()=>{if(busy||document.visibilityState==='hidden')return;try{if(DW.account)await DW.sync();await checkGuard();const newS=DW.state;newS.activity.current=guardLink.activity||'';const st={...DW.status,native:guardLink.connected};const changed=newS.revision!==S.revision||st.cloud.pending!==status.cloud.pending||st.cloud.connected!==status.cloud.connected;S=newS;status=st;if(changed&&!focused()&&!Q('.dialog-back'))render();else{const strip=Q('#cloudStatus');if(strip)strip.innerHTML=cloudStatusBar();}}catch(e){console.warn('DayWith background sync',e)}},20000);

 localStorage.setItem('dw6.cloud',JSON.stringify({url:u,publishableKey:k}));
 location.reload();return;}
case 'cloudLoginForm':try{await DW.login(p.email,p.password);S=DW.state;status=DW.status;render();cloudDialog();toast('클라우드에 연결됐어.');}catch(e){toast('로그인 실패: '+e.message,true)}return;
case 'guardForm':{if(!/^\d{8}$/.test(p.code||'')){toast('8자리 연결 번호를 확인해줘.',true);return}guardLink.code=p.code;localStorage.setItem('dw5.guardCode',p.code);await checkGuard();if(guardLink.connected){closeDialog();status={...DW.status,native:true};render();toast('Windows 게임 감지와 연결됐어.')}else toast('Windows 게임 감지기가 실행 중인지, 연결 코드를 확인해줘.',true);return;}
case 'taskAdd':{const t=parseQuickTask(p.title);if(!t.title)return;const r=await act('task.add',{...t,at:'',kind:'work'});if(r)toast('마감 순서에 넣었어.');return;}
case 'taskEditForm':{const task={id:f.dataset.id,title:p.title.trim(),firstStep:p.firstStep.trim(),due:p.due||'',minutes:Number(p.minutes),at:f.dataset.id?(S.tasks.find(t=>t.id===f.dataset.id)?.at||''):''};const result=await act(task.id?'task.update':'task.add',task);if(result){closeDialog();toast('작업을 저장했어.')}return;}
case 'budgetForm':if(await act('money.budget',{amount:Number(p.amount)}))closeDialog();return;
case 'moneyQuickSpent':{const x=parseMoneyEntry(p.entry);if(!(x.amount>0&&x.amount<=1e9))throw Error('금액을 읽지 못했어. 예: 점심 12000원');if(await act('money.spent',{title:x.title,amount:x.amount})){toast(`${x.title} ${won(x.amount)} 기록했어.`);}return;}
case 'moneyQuickHold':{const x=parseMoneyEntry(p.entry);if(!(x.amount>0&&x.amount<=1e9))throw Error('가격을 읽지 못했어. 예: 모니터 35만원 12개월');if(x.installments<1||x.installments>120)throw Error('할부 개월 수는 1~120 사이여야 해.');if(await act('purchase.add',{title:x.title,price:x.amount,installments:x.installments,reason:'계획 밖 구매 충동 보류'})){closeDialog();toast(`${x.title} ${won(x.amount)} · 24시간 보류에 넣었어.`);}return;}
case 'expenseForm':if(await act('money.spent',{title:p.title,amount:Number(p.amount)})){closeDialog();toast('이달 지출에 반영했어.')}return;
case 'holdAdd':{const r=await act('purchase.add',{title:p.title,price:Number(p.price),installments:Number(p.installments),reason:'하루 동안 다시 생각하기'});if(r)toast('24시간 대기함에 넣었어.');return;}
case 'sleepForm':if(await act('sleep.add',{bed:p.bed,fellAsleep:p.fellAsleep,wake:p.wake,sleepy:Number(p.sleepy),note:''})){closeDialog();toast('실제로 기억나는 수면을 기록했어.')}return;
case 'cutoffForm':if(await act('easy.cutoff',{time:p.time,end:p.end,enabled:true})){closeDialog();toast('마감 시간을 설정했어.')}return;
case 'characterForm':{const r=await updateSettings(s=>{s.characters[0].name=p.name.trim();s.characters[0].tone=p.tone});if(r)toast('한 명의 캐릭터 설정을 바꿨어.');return;}
case 'routineForm':{const r=await updateSettings(s=>{s.cutoff=p.cutoff;s.routineEnd=p.routineEnd;s.movementDelay=Number(p.movementDelay);s.workDelay=Number(p.workDelay);s.routineEnabled=!!p.routineEnabled;s.startup=false;s.wakeFollowups=true});if(r)toast('이제 이 규칙으로 계속 도와줄게.');return;}
case 'chatForm':await chatSend(p.text||'');return;
}}
async function chatSend(text){text=String(text).trim();if(!text)return;const input=Q('#chatText');if(!input)return;const b=Q('#sendChat');if(b)b.disabled=true;try{S=await req('action',{type:'chat',payload:{text}});const reply=[...S.messages].reverse().find(m=>m.role==='companion')?.text||'';input.value='';render();speak(reply);setTimeout(()=>{const f=Q('#chatFeed');if(f)f.scrollTop=f.scrollHeight;Q('#chatText')?.focus()},20);}catch(e){input.value=text;toast('대화 오류: '+e.message,true);}finally{if(b)b.disabled=false}}
async function photoUpload(file){if(!file)return;const formats=['image/jpeg','image/png','image/webp'];if(!formats.includes(file.type)){toast('JPG, PNG, WebP 사진만 선택해줘.',true);return}const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const scale=Math.min(1,500/Math.max(img.width,img.height));canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.67))};img.onerror=reject;img.src=reader.result};reader.readAsDataURL(file)});const r=await updateSettings(s=>{s.characters[0].photo=data});if(r)toast('캐릭터 사진을 바꿨어.');}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act],[data-page]');if(!el||el.disabled)return;if(el.dataset.page){navigate(el.dataset.page);return}e.preventDefault();try{await runAction(el.dataset.act,el)}catch(err){toast(err.message,true)}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(busy&&f.id!=='pairForm')return;try{await submitForm(f)}catch(err){toast(err.message,true)}});
document.addEventListener('change',async e=>{const x=e.target;try{
 if(x.id==='voiceAuto'){voiceCfg.enabled=x.checked;saveVoice()}else if(x.id==='voiceSelect'){voiceCfg.name=x.value;saveVoice()}else if(x.id==='voiceRate'){voiceCfg.rate=Number(x.value);saveVoice()}else if(x.id==='voicePitch'){voiceCfg.pitch=Number(x.value);saveVoice()}
 else if(x.id==='observeToggle'){if(x.checked&&!confirm('PC에서 앱이 실행 중일 때만 전면 프로그램 종류를 분류해. 화면·키 입력은 수집하지 않아. 게임 복귀 알림을 켤까?')){x.checked=false;return}const r=await act('easy.observe',{enabled:x.checked});if(r)toast(x.checked?'게임 복귀 감지를 켰어.':'PC 활동 감지를 껐어.')}
 else if(x.id==='gameMode'){if(x.value==='force'&&!confirm('강제 종료는 저장하지 않은 게임 진행이 사라질 수 있어. 정말 강제 종료를 켤까?')){render();return}const mode=x.value,ok=await updateSettings(s=>{s.guardMode=mode;s.forceConsent=mode==='force'});if(ok)toast('선택한 게임 보호 방식을 저장했어.')}
 }catch(err){toast(err.message,true)}});
Q('#photo-picker').addEventListener('change',e=>{photoUpload(e.target.files[0]).catch(x=>toast(x.message,true));e.target.value=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog();if(e.key==='Enter'&&e.ctrlKey&&e.target.id==='chatText'){e.preventDefault();Q('#chatForm')?.requestSubmit()}});
Q('#backup-picker').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>3*1024*1024)throw Error('백업 파일은 3MB 이내로 줄여줘.');const data=JSON.parse(await file.text());const snap=data.state||data;if(!confirm('4.0 백업에서 작업·지출·수면 기록을 현재 데이터와 합칠까?'))return;S=DW.importV4(snap);render();toast('기존 기록을 합쳤어. 로그인을 했다면 동기화도 진행돼.');}catch(e){toast(e.message,true)}finally{ev.target.value='';}});
async function guardRequest(path,payload){if(!guardLink.code)throw Error('Windows 게임 감지 연결 번호를 먼저 입력해줘.');const u='http://127.0.0.1:43832/'+path;
 const r=await fetch(u,{method:payload?'POST':'GET',headers:{'X-DayWith-Pair':guardLink.code,...(payload?{'Content-Type':'application/json'}:{})},body:payload?JSON.stringify(payload):undefined,signal:AbortSignal.timeout(2500)});
 if(!r.ok)throw Error('게임 감지 연결 오류 '+r.status);return r.json();}
async function checkGuard(){if(!guardLink.code||/Android|iPhone|iPad/i.test(navigator.userAgent))return;
 try{const g=await guardRequest('status');guardLink.connected=true;guardLink.activity=g.activity||'';guardLink.lastSeen=Date.now();status={...DW.status,native:true};if(S){S.activity.current=g.activity||'';if(g.lastNudge&&g.lastNudge>guardLink.lastPrompt){guardLink.lastPrompt=g.lastNudge;toast('게임에서 잠깐 나와 작업으로 2분 복귀해볼까?');}}
  await guardRequest('settings',{observe:S.easy.observe,games:S.settings.games.map(x=>x.name),dueTask:pending()[0]?.title||'',hasWork:pending().length>0,cutoff:S.settings.cutoff,end:S.settings.routineEnd||S.settings.wakeTarget,routineEnabled:S.settings.routineEnabled,appUrl:location.origin+location.pathname});
 }catch(e){guardLink.connected=false;}}
function schedulerTick(){if(!S||document.visibilityState==='hidden')return;const n=Math.floor(Date.now()/1000);const d=dateString(new Date());
 function notifyOnce(key,message){const storage='dw5.nudge.'+d+'.'+key;if(document.visibilityState==='hidden'&&(!('Notification'in window)||Notification.permission!=='granted'))return;if(localStorage.getItem(storage))return;localStorage.setItem(storage,'1');toast(message);
 if('Notification' in window&&Notification.permission==='granted'){try{new Notification('DayWith · '+char().name,{body:message,icon:window.DAYWITH_NOTIFICATION_ICON})}catch{}}}
 if(manualGameActive()&&pending().length&&gameSessionMinutes()>=10)notifyOnce('game-'+(latestGameLog('game-start')?.at||0)+'-'+Math.floor(gameSessionMinutes()/10),'게임 시작 후 '+gameSessionMinutes()+'분이야. 마감 업무가 있다면 2분 복귀해볼까?');
 if(S.easy.startedAt&&n-S.easy.startedAt<18*3600){if(S.easy.moveState==='pending'&&n>=S.easy.moveDue&&n-S.easy.moveDue<25*60)notifyOnce('move','운동복부터 입고 5~10분 가볍게 움직여볼까?');if(S.easy.workState==='pending'&&n>=S.easy.workDue&&n-S.easy.workDue<25*60)notifyOnce('work','지금 가장 급한 일부터 10분만 시작해보자!');}
 if(S.settings.routineEnabled){const cutoff=S.settings.cutoff||'00:00';const [h,m]=cutoff.split(':').map(Number),thisMin=new Date().getHours()*60+new Date().getMinutes(),target=h*60+m;for(const delta of [30,10,0]){const scheduled=(target-delta+1440)%1440;if(thisMin===scheduled)notifyOnce('cutoff'+delta,delta?`PC 마감 ${delta}분 전이야. 저장하고 게임을 마무리하자.`:'PC 마감 시간이야. 저장하고 화면에서 떨어져보자.');}}
}
setInterval(schedulerTick,30000);
boot();
</script>
