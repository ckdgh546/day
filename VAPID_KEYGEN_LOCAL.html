<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DayWith 푸시 키 생성기 — 기기에서만 실행</title>
<style>body{font:15px/1.7 system-ui,'Malgun Gothic',sans-serif;background:#f5f7f3;color:#23352f;max-width:760px;margin:40px auto;padding:22px}main{padding:30px;border-radius:22px;background:white;box-shadow:0 5px 20px #0001}button{border:0;border-radius:10px;background:#3d776f;color:#fff;padding:14px 18px;cursor:pointer;font:inherit}textarea{width:100%;height:84px;box-sizing:border-box;margin:7px 0 17px;font:13px/1.5 monospace;padding:12px;overflow-wrap:anywhere}.warn{color:#a33e32;background:#fff5ec;padding:12px;border-radius:10px}label{font-weight:700}</style>
<main><h1>DayWith 푸시용 키 생성기</h1><p><strong>이 페이지는 외부 서버에 접속하지 않고 네 브라우저 안에서만 키를 만들어.</strong> 생성한 키는 꼭 별도로 보관하고, 비밀키를 GitHub 저장소에 올리면 안 돼.</p><button id="generate">🔐 키 새로 만들기</button><p class="warn">아래 비밀키는 캡처·공유하지 마. Supabase → Edge Functions → Secrets의 <code>VAPID_PRIVATE_KEY</code>에만 등록해.</p><label for="pub">VAPID_PUBLIC_KEY (공개용)</label><textarea id="pub" readonly></textarea><label for="priv">VAPID_PRIVATE_KEY (비밀 · 공개 금지)</label><textarea id="priv" readonly></textarea><label for="cron">DAYWITH_CRON_TOKEN (비밀 · 공개 금지)</label><textarea id="cron" readonly></textarea><p id="status"></p></main>
<script>
function b64u(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function un64(v){let s=v.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
document.querySelector('#generate').onclick=async()=>{
 try {
  const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);
  const pub=await crypto.subtle.exportKey('jwk',pair.publicKey),priv=await crypto.subtle.exportKey('jwk',pair.privateKey);
  const bytes=new Uint8Array(65);bytes[0]=4;bytes.set(un64(pub.x),1);bytes.set(un64(pub.y),33);
  document.querySelector('#pub').value=b64u(bytes);
  document.querySelector('#priv').value=priv.d;
  document.querySelector('#cron').value=b64u(crypto.getRandomValues(new Uint8Array(32)));
  document.querySelector('#status').textContent='생성 완료. 공개키·비밀키를 각각 Supabase Edge Function Secrets에 저장하면 돼.';
 }catch(e){document.querySelector('#status').textContent='생성 실패: '+e.message+' (HTTPS 또는 최신 브라우저에서 열어줘.)'}
};
</script></html>
